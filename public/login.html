<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Sajina S</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/auth.js" defer></script>
</head>

<body class="auth-page">
    <main class="auth-card">
        <a href="/" class="auth-brand"><span class="brand-logo">S</span> SAJINA S</a>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login to your <span class="gradient-text">account</span></h1>
        <p class="auth-subtitle">Enter your registered email and password.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password"
                autocomplete="current-password" required />

            <p id="loginMessage" class="form-message" role="status"></p>
            <button class="btn btn-primary auth-submit" type="submit">
                Login ↗
            </button>
        </form>

        <p class="auth-switch">Don't have an account?
            <a href="/signup.html">Sign up</a>
        </p>
        <a href="/" class="back-link">← Back to portfolio</a>
    </main>
</body>

</html>
